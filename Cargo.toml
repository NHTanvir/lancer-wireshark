[workspace]
resolver = "2"
members = [
    "crates/lancer-wireshark",
    "crates/wsutil",
    "crates/epan",
    "crates/capture",
    "crates/lua",
    "crates/ui",
    "crates/tools/editcap",
    "crates/tools/mergecap",
    "crates/tools/capinfos",
    "crates/tools/text2pcap",
    "crates/tools/randpkt",
    "crates/tools/rawshark",
    "crates/tools/sharkd",
    "crates/tools/dumpcap",
]
default-members = ["crates/lancer-wireshark"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-wireshark"
description = "Rust clone of wireshark — part of the Lancer bug bounty toolkit"

[workspace.dependencies]
# CLI / runtime
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
once_cell = "1"

# Capture / parsing
pcap = "2"
pcap-file = "2"
etherparse = "0.15"

# Display filter DSL
nom = "7"
regex = "1"

# Hex / bytes / time
hex = "0.4"
byteorder = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

# Crypto / TLS
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Serde / JSON / XML
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.31", features = ["serialize"] }

# Compression
flate2 = "1"
zstd = "0.13"
lz4_flex = { version = "0.11", features = ["frame"] }
brotli = "6"

# GUI
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
egui_plot = "0.27"
rfd = "0.14"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
muda = "0.13"
egui-notify = "0.14"

# Concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "5"

# HTTP server (cross-tool integration)
tiny_http = "0.12"

# Scripting
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# Networking helpers
ipnetwork = "0.20"
mac_address = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
